# =============================================================================
# Proxy — standalone, shared across all apps on this machine
#
# This is its own git repo. Deploy once per machine:
#   docker compose up -d
#
# How it works:
#   Creates the "nginx_proxy" Docker network. Any app that joins this network
#   and sets VIRTUAL_HOST gets automatically routed — no changes needed here.
#   Apps that also set LETSENCRYPT_HOST get automatic TLS via Let's Encrypt
#   (acme-companion issues and renews certs without any manual intervention).
#
# Note: update DEFAULT_EMAIL on the acme service before first deploy.
# =============================================================================

services:

  proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:rw          # rw — acme-companion writes certs here
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - proxy_net

  # Let's Encrypt — watches for LETSENCRYPT_HOST on any proxied container
  # and issues/renews certs automatically. No config needed per-app.
  acme:
    image: nginxproxy/acme-companion:latest
    container_name: nginx_proxy_acme
    restart: unless-stopped
    volumes_from:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
    environment:
      DEFAULT_EMAIL: admin@b2bmarket.ca   # ← update to your real email
    networks:
      - proxy_net

volumes:
  certs:
  vhost:
  html:
  acme:

networks:
  proxy_net:
    name: nginx_proxy   # well-known name; all apps declare this as external
    driver: bridge
